# appareil.conf — CE QUI EST PROPRE À UN APPAREIL. Tout le reste de pxl-bootsplash est commun.
# Posé dans /etc/pxl-bootsplash/appareil.conf par `installer.sh --appareil CE_FICHIER`. C'est du bash (sourcé).

# Le nom du produit, en pied de page (avec le nom de la machine), si `pied` n'est pas défini plus bas.
PRODUIT="PXL"

# Les étapes, dans l'ordre (8 au plus). Chacune est une SONDE : /etc/pxl-bootsplash/sondes/<nom>.sh (celles de
# l'appareil, posées par --sondes DOSSIER) ou /usr/lib/pxl-bootsplash/sondes/<nom>.sh (communes : systeme, reseau,
# heure, pxlnet). Une sonde définit LIBELLE="…" et `sonde() { echo "ÉTAT|détail"; }` — 0 attente · 1 en cours ·
# 2 fait · 3 défaut · 4 avertissement ; $1 = secondes depuis le démarrage.
ETAPES="systeme reseau heure pxlnet"

# Réglages des sondes communes
RESEAU_IFACES="eth0 wlan0"     # par ordre de préférence
RESEAU_SECOURS=""              # adresse fixe de secours (elle ne prouve aucun DHCP)

# LE PROGRAMME D'AFFICHAGE (son unité systemd) : c'est lui qui prend l'écran à Plymouth. L'installeur lui pose un
# complément (`lacher` avant lui, et PXL_BOOTSPLASH_TEMOIN dans son environnement : il crée ce fichier quand sa
# première image est balayée). Vide : Plymouth part dès que le système est levé.
AFFICHAGE_UNITE=""
AFFICHAGE_ETAPE=""             # l'étape (son nom dans ETAPES) qui dit « ouverture de l'affichage… »
FIN=deactivate                 # deactivate (Plymouth lâche le DRM sans partir) | quit (--retain-splash, comme la box)
FIN_S=90                       # sans signal de première image : Plymouth part au bout de FIN_S s (peut noircir)

# L'ARRÊT : étapes (sondes communes arret-*) et durée pendant laquelle la barre pleine reste à l'écran avant le
# redémarrage matériel (1.1.3 — sinon l'écran s'éteignait avant que la barre arrive au bout). 5 s au plus.
# ETAPES_ARRET="arret-demande arret-affichage arret-services arret-fin"
FIN_ARRET_S=1

# LE MODE DE L'ÉCRAN : le préféré de l'EDID ; sans EDID (après re-sonde), ce repli, calculé comme `video=` (GTF).
SANS_EDID=800x480@60           # « aucun » : laisser le noyau
CONNECTEUR=""                  # vide : le premier écran branché

# Pied de page (facultatif) : une fonction qui l'imprime.
# pied() { echo "$(hostname)  ·  $PRODUIT  ·  v$(cat /opt/mon-appareil/VERSION)"; }

# tty1 : `couper` (défaut) désactive getty@tty1 — sinon une invite de connexion apparaît dès que Plymouth part, et à
# chaque relance du programme d'affichage. `garder` pour un appareil qui doit offrir une console locale.
GETTY_TTY1=couper
