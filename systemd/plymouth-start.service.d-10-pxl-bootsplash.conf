# pxl-bootsplash — Plymouth démarre APRÈS la décision de mode : il reprend le mode ACTIF de l'écran (renderer drm,
# « Looking for connector mode index of active mode », relu dans drm.so de Debian 22.02 le 30/10/2026).
# ⚠️ (1.0.3) Les conditions sont REMISES À ZÉRO (une affectation vide les efface toutes) puis reposées sans `!nosplash` :
# la ligne de commande porte `nosplash` pour éteindre le Plymouth de l'initrd (Debian le lance par défaut), et
# celui-ci doit tourner quand même. Revers assumé : plymouth-reboot/-poweroff/-halt restent éteints (`!nosplash`).
[Unit]
ConditionKernelCommandLine=
ConditionKernelCommandLine=!plymouth.enable=0
ConditionVirtualization=!container
Wants=pxl-bootsplash-mode.service
After=pxl-bootsplash-mode.service
