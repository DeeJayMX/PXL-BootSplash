# pxl-bootsplash — posé sur le PROGRAMME D'AFFICHAGE de l'appareil (AFFICHAGE_UNITE d'appareil.conf).
# Avant lui : Plymouth lâche le DRM (son image reste). « - » : un échec ne l'empêche JAMAIS de démarrer ; « + » : root.
# PXL_BOOTSPLASH_TEMOIN : le programme CRÉE ce fichier quand sa première image est balayée — Plymouth part alors.
[Service]
ExecStartPre=-+/usr/lib/pxl-bootsplash/lacher
Environment=PXL_BOOTSPLASH_TEMOIN=/run/pxl-bootsplash/signal/premiere-image
